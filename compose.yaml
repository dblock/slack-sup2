services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://host.docker.internal:27017/slack_sup2_development?directConnection=true
      NEW_RELIC_AGENT_ENABLED: "false"
      PORT: "5000"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "5000:5000"
