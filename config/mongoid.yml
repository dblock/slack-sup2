development:
  clients:
    default:
      uri: <%= ENV.fetch('MONGO_URL', 'mongodb://127.0.0.1:27017/slack_sup2_development') %>
  options:
    raise_not_found_error: false
    use_utc: true

test:
  clients:
    default:
      uri: <%= ENV.fetch('MONGO_URL', 'mongodb://127.0.0.1:27017/slack_sup2_test') %>
  options:
    raise_not_found_error: false
    use_utc: true

production:
  clients:
    default:
      uri: <%= ENV['MONGO_URL'] || ENV['MONGOHQ_URI'] || ENV['MONGOLAB_URI'] %>
  options:
    raise_not_found_error: false
    use_utc: true
